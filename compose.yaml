services:
  bot:
    build: .
    container_name: wp-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SESSION_PATH: /app/auth_info
      API_URL: ${API_URL:-http://backend:8080}
      DATABASE_URL: ${DATABASE_URL}
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGSSL: ${PGSSL}
      # API HTTP do bot (envio de mensagens). Acessível apenas pela rede Docker: a API Java usa http://wp-bot:3000.
      WPP_BOT_API_PORT: ${WPP_BOT_API_PORT:-3000}
      WPP_BOT_API_TOKEN: ${WPP_BOT_API_TOKEN:-}
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-55}
    expose:
      - "${WPP_BOT_API_PORT:-3000}"
    volumes:
      - whatsapp-auth:/app/auth_info
    networks:
      - postgres-network

volumes:
  whatsapp-auth:

networks:
  postgres-network:
    external: true
    name: covil-calango-api_default
